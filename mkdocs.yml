site_name: dp800-practice
site_description: Repositorio de práctica para el examen DP-800 (SQL AI Developer Associate) — curso DP-800T00-A.
site_url: https://christiangrimberg.github.io/dp800-practice
repo_url: https://github.com/ChristianGrimberg/dp800-practice
repo_name: ChristianGrimberg/dp800-practice
edit_uri: edit/main/

docs_dir: curso
site_dir: site

# Excluir archivos que no son parte del sitio
exclude_docs: |
  _meta/
  _plantillas/

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es
  - awesome-pages
  - git-revision-date-localized:
      fallback_to_build_date: true
      enable_creation_date: false

nav:
  - Inicio: _extras/index.md
  - Mapa de aprendizaje: mapa-de-aprendizaje.md
  - Recursos:
      - Glosario: _extras/glosario.md
      - Bibliografía: _extras/bibliografia.md
      - Comandos útiles: _extras/comandos-utiles.md
      - Guía de Obsidian: _extras/obsidian.md
  - Guía de contribución: _extras/CONTRIBUTING.md
  - Routing de agentes: _extras/AGENTS.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
      slugify:
        !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["curso"]
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.smartsymbols
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ChristianGrimberg
  generator: false

extra_css:
  - assets/css/extra.css
