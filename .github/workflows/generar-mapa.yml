name: 🗺️ Regenerar mapa de aprendizaje

on:
  push:
    branches: [main]
    paths:
      - 'curso/**/*.md'
      - 'scripts/generar-mapa.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar script
        run: bash scripts/generar-mapa.sh

      - name: Commitear si hay cambios
        run: |
          if [[ -n "$(git status --porcelain curso/mapa-de-aprendizaje.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add curso/mapa-de-aprendizaje.md
            git commit -m "🤖 regenerar mapa de aprendizaje"
            git push
          else
            echo "Sin cambios en el mapa."
          fi
